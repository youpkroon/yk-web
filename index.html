<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YK Portfolio</title>
<style>
html,body{margin:0;min-height:100%;background:#0c0d0f;color:#fff;font-family:Arial,Helvetica,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.65}
</style>
</head>
<body>
<div id="loading">Loading YK portfolio…</div>
<script>
(async()=>{
  const files=["site/chunk-01.txt","site/chunk-02.txt","site/chunk-03.txt","site/chunk-04.txt","site/chunk-05.txt","site/chunk-06.txt","site/chunk-07.txt","site/chunk-08.txt","site/chunk-09.txt","site/chunk-10.txt","site/chunk-11.txt","site/chunk-12.txt","site/chunk-13.txt","site/chunk-14.txt","site/chunk-15.txt","site/chunk-16.txt","site/chunk-17.txt","site/chunk-18.txt"];
  try{
    const parts=await Promise.all(files.map(p=>fetch(p,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('Failed to load '+p);
      return r.text();
    })));
    document.open();
    document.write(parts.join(''));
    document.close();
  }catch(err){
    document.getElementById('loading').textContent='Unable to load portfolio';
    console.error(err);
  }
})();
</script>
</body>
</html>
